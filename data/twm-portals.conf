# xdg-desktop-portal backends under twm (XDG_CURRENT_DESKTOP=twm).
# twm answers consent dialogs itself, in its trusted frame; screen sharing
# goes through xdg-desktop-portal-wlr with `twm --choose` as its chooser
# (see xdg-desktop-portal-wlr.conf); the rest falls back to GTK.
[preferred]
default=gtk
org.freedesktop.impl.portal.Access=twm
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
